name: Verify install and build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run package:training -- --check
      - run: npm test
      - run: npm run build
      - run: npm run runtime:check
      - run: node tools/check-release.cjs
      - name: Ensure generated assets match the submitted sources
        run: |
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"

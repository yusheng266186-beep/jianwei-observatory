name: Verify install and build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run package:training -- --check
      - run: npm test
      - run: npm run build
      - run: npm run runtime:check
      - run: node tools/check-release.cjs
      - name: Ensure generated assets match the submitted sources
        run: |
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run the twelve-step browser smoke journey
        env:
          AUDIT_BROWSER: ${{ matrix.browser }}
          AUDIT_URL: http://127.0.0.1:4173
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > "$RUNNER_TEMP/browser-smoke-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          curl --retry 10 --retry-connrefused --retry-delay 1 --fail --silent http://127.0.0.1:4173/ > /dev/null
          npm run test:smoke
          npm run test:keyboard
          npm run test:workspace-care
          npm run test:archive-reliability
          npm run test:experience
          npm run test:continuation
          npm run test:interaction-polish
          npm run test:global-motion
          npm run test:large-workspace
          if [ "$AUDIT_BROWSER" = chromium ]; then npm run test:document-regression; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-smoke-${{ matrix.browser }}-results
          path: |
            .audit-output/hengji-audit-results.json
            .audit-output/hengji-*.png
            .audit-output/keyboard-viewport*/results.json
            .audit-output/keyboard-viewport*/*.png
            .audit-output/large-workspace-*/checks.json
            .audit-output/large-workspace-*/failure.json
            .audit-output/large-workspace-*/*.png
            .audit-output/workspace-care-*/checks.json
            .audit-output/workspace-care-*/*.png
            .audit-output/archive-reliability-*/checks.json
            .audit-output/archive-reliability-*/*.png
            .audit-output/experience-reliability-*/checks.json
            .audit-output/experience-reliability-*/*-failure.json
            .audit-output/experience-reliability-*/*.png
            .audit-output/continuation-reliability-*/checks.json
            .audit-output/continuation-reliability-*/*-failure.json
            .audit-output/continuation-reliability-*/*.png
            .audit-output/interaction-polish-*/checks.json
            .audit-output/interaction-polish-*/*-failure.json
            .audit-output/interaction-polish-*/*.png
            .audit-output/global-motion-*/checks.json
            .audit-output/global-motion-*/*-failure.json
            .audit-output/global-motion-*/*.png
            .audit-output/document-regression/exports.json
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
